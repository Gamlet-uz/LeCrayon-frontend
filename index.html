<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Le Crayon - Davomat</title>
  
  <!-- Telegram Web App API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome (Ikonkalar uchun) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Asosiy CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOADING ANIMATSIYASI -->
  <div id="loader" class="loader-overlay hidden">
    <div class="spinner"></div>
    <p>Yuklanmoqda...</p>
  </div>

  <!-- ASOSIY HEADER -->
  <header class="app-header">
    <button id="back-btn" class="back-btn hidden"><i class="fa-solid fa-chevron-left"></i> Ortga</button>
    <h1 class="logo-title"><i class="fa-solid fa-pen-nib"></i> Le Crayon</h1>
  </header>

  <main id="app-content">

    <!-- 1. ROL TANLASH EKRANI (Bosh sahifa) -->
    <section id="screen-role" class="screen active fade-in">
      <div class="role-container">
        <h2>Tizimga kirish</h2>
        <p>Iltimos, o'z rolingizni tanlang</p>
        
        <button class="role-btn teacher-btn" onclick="app.showScreen('screen-teacher-menu')">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span>O'qituvchi</span>
        </button>

        <button class="role-btn admin-btn" onclick="app.showScreen('screen-admin-menu')">
          <i class="fa-solid fa-user-shield"></i>
          <span>Admin</span>
        </button>
      </div>
    </section>

    <!-- ============================================== -->
    <!-- ADMIN BO'LIMI -->
    <!-- ============================================== -->

    <!-- Admin Menyu Ekrani -->
    <section id="screen-admin-menu" class="screen slide-up hidden">
      <h2 class="section-title">Admin Paneli</h2>
      <div class="menu-grid">
        <div class="menu-card" onclick="app.showScreen('screen-add-class')">
          <i class="fa-solid fa-layer-group"></i>
          <h3>Sinf yaratish</h3>
        </div>
        <div class="menu-card" onclick="app.loadClassesAndShowAddStudent()">
          <i class="fa-solid fa-user-plus"></i>
          <h3>O'quvchi qo'shish</h3>
        </div>
        <div class="menu-card" onclick="app.loadAdminReport()">
          <i class="fa-solid fa-chart-pie"></i>
          <h3>Davomat Hisoboti</h3>
        </div>
      </div>
    </section>

    <!-- Sinf yaratish ekrani -->
    <section id="screen-add-class" class="screen slide-up hidden">
      <h2 class="section-title">Yangi sinf ochish</h2>
      <form id="form-add-class" class="custom-form">
        <div class="form-group">
          <label>Sinf nomi (masalan: 10-A)</label>
          <input type="text" id="class-name" required placeholder="Sinf nomini kiriting">
        </div>
        <button type="submit" class="primary-btn">Saqlash</button>
      </form>
    </section>

    <!-- O'quvchi qo'shish ekrani (Eng katta forma) -->
    <section id="screen-add-student" class="screen slide-up hidden">
      <h2 class="section-title">Yangi o'quvchi</h2>
      <form id="form-add-student" class="custom-form">
        
        <!-- Rasm yuklash -->
        <div class="photo-upload-container">
          <img id="preview-photo" src="https://via.placeholder.com/100?text=Rasm" alt="Rasm">
          <input type="file" id="student-photo" accept="image/*" required>
          <label for="student-photo" class="upload-btn"><i class="fa-solid fa-camera"></i> Rasm tanlash</label>
        </div>

        <div class="form-group">
          <label>Ism va Familiya</label>
          <input type="text" id="student-name" required placeholder="To'liq ism">
        </div>

        <div class="form-group">
          <label>Sinfni tanlang</label>
          <select id="student-class" required>
            <!-- JS orqali to'ldiriladi -->
          </select>
        </div>

        <div class="form-group">
          <label>Doimiy yashash manzili</label>
          <input type="text" id="perm-address" required placeholder="Viloyat, tuman, ko'cha">
        </div>

        <div class="form-group">
          <label>Yotoqxona manzili (agar bo'lsa)</label>
          <input type="text" id="dorm-address" placeholder="Yotoqxona raqami, xona">
        </div>

        <div class="form-group">
          <label>Ota-ona telefon raqami</label>
          <input type="tel" id="parent-phone" required placeholder="+998 90 123 45 67">
        </div>

        <div class="form-group">
          <label>Yotoqxona mas'uli telefon raqami</label>
          <input type="tel" id="dorm-phone" placeholder="+998 90 123 45 67">
        </div>

        <!-- Sertifikatlar qismi (Dinamik) -->
        <div class="certificates-section">
          <h3>Sertifikatlar</h3>
          <div id="certificates-container"></div>
          <button type="button" class="secondary-btn" onclick="app.addCertificateField()">
            <i class="fa-solid fa-plus"></i> Sertifikat qo'shish
          </button>
        </div>

        <button type="submit" class="primary-btn submit-btn">O'quvchini Saqlash</button>
      </form>
    </section>

    <!-- Admin Hisobot (Report) Ekrani -->
    <section id="screen-admin-report" class="screen slide-up hidden">
      <h2 class="section-title">Davomat va O'quvchilar</h2>
      <div class="filter-group">
        <input type="text" id="search-student" placeholder="O'quvchini izlash..." oninput="app.filterStudents()">
      </div>
      <div id="report-list" class="report-list">
        <!-- JS orqali o'quvchilar kartochkalari tushadi -->
      </div>
    </section>

    <!-- ============================================== -->
    <!-- O'QITUVCHI BO'LIMI -->
    <!-- ============================================== -->

    <!-- O'qituvchi Menyu Ekrani -->
    <section id="screen-teacher-menu" class="screen slide-up hidden">
      <h2 class="section-title">Davomat qilish</h2>
      <p>Davomat olinadigan sinfni tanlang:</p>
      <div id="teacher-classes-list" class="menu-grid">
        <!-- JS orqali sinflar chiqadi -->
      </div>
    </section>

    <!-- Davomat belgilash ekrani -->
    <section id="screen-attendance" class="screen slide-up hidden">
      <h2 class="section-title" id="attendance-class-title">10-A Sinf</h2>
      <form id="form-attendance">
        <div id="attendance-list" class="attendance-list">
          <!-- JS orqali har bir o'quvchi va radio tugmalar (Keldi/Sababli/Sababsiz) chiqadi -->
        </div>
        <button type="button" class="primary-btn submit-btn" onclick="app.submitAttendance()">
          Davomatni Saqlash
        </button>
      </form>
    </section>

  </main>

  <!-- JS Fayllarni ulash -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
